# One OcharoCatalogue instance per environment. Bring up from engineering/deployment/catalogue/:
#
#   docker compose up -d --build
#
# The SQLite store lives on the named volume so data survives container replacement.
services:
  ocharocatalogue:
    build:
      context: ../../codebase
      dockerfile: ../deployment/catalogue/Dockerfile
    image: ocharocatalogue
    container_name: ocharocatalogue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8080"
    volumes:
      - ocharocatalogue-data:/data

volumes:
  ocharocatalogue-data:
