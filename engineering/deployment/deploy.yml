# yaml-language-server: $schema=../../../../../../../../../conventions/deployment/descriptor/deploy.schema.json
# What this product deploys: its sites, its services, how each builds, what changes it and which paths it serves.
# Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets and
# environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
#
# Ocharo Platform deploys Desk, its jobs worker, the private image worker, the adopted Brand and Catalogue pilots and
# Ocharo's own Identity instance, through which Desk, Brand and Catalogue sign in, as the primary repository of the one
# `ocharo` product (Wheelhouse decision 70): Studio, Marketing and Assets deploy beside it, so service, site and volume
# names stay unique across them, and Desk's site is the product's front door.
# Brand and Catalogue store in schemas `brand` and `catalogue` of the product database; each volume keeps blobs stored
# before WoW2 Files and the retired SQLite store until `import-sqlite` (deployment.md § Brand and Catalogue pilots).
# Desk and jobs compile only the pilots' Domain projects.
# dev runs as .NET Development and prod as Production (dotnetEnvironment). Desk's `migrate` item applies its schema before any
# service restarts; Desk still applies it as it starts and reports ready only afterwards, and jobs refuses to start on a
# missing schema, so it waits for Desk to be healthy.
descriptor: 2
product: ocharo
dotnetEnvironment: true               # dev runs as .NET Development, prod as Production
name: Ocharo Platform
description: Ocharo Desk, the operator workspace for Ocharo's brand identity, product authority, commerce and business management.
sites:
  desk: {}                              # Desk, public: a domain, or Wheelhouse's sslip.io host until one is bound
  brand: {}                             # Brand, signed in through Ocharo's Identity; its public feed stays anonymous
  catalogue: {}                         # Catalogue authoring, signed in; the published reader stays anonymous
  identity: {}                          # Ocharo's own Identity: sign-in and tokens for every Ocharo app
# Before any service restarts (pipelines v0.12.0), Ocharo's Identity applies its `identity` migration set to Ocharo's
# database, then Desk's image applies Desk's sets with the be sdk's `migrate` verb; Wheelhouse fills
# Migrations:ConnectionString from the target's database.
migrate:
  - service: identity
    command: [dotnet, Identity.Api.dll, migrate]
    timeout: 10m
  - service: desk
    command: [dotnet, BrandWorkspace.Api.dll, migrate]
    timeout: 10m
  - service: brand                      # the `brand` set and its session cache's `distributed_cache` set (schema brand_cache)
    command: [dotnet, OcharoBrand.Api.dll, migrate]
    timeout: 5m
  - service: catalogue                  # the `catalogue` set and its session cache's set (schema catalogue_cache)
    command: [dotnet, OcharoCatalogue.Api.dll, migrate]
    timeout: 5m
# After migrate and before any restart, and on every settings-only apply, each item's image checks the settings the
# deploy applies (pipelines v0.15.0, Wheelhouse v0.12): exit 0 consistent, 1 refused, 2 failed, a `config-result` line
# last; a refused or retired key stops the deploy while the running release keeps serving. Identity, Desk, Brand and
# Catalogue answer `config check`; jobs and the image worker answer none yet, so they have no item.
configCheck:
  - service: identity
    command: [dotnet, Identity.Api.dll, config, check]
    timeout: 2m
  - service: desk
    command: [dotnet, BrandWorkspace.Api.dll, config, check]
    timeout: 2m
  - service: brand
    command: [dotnet, OcharoBrand.Api.dll, config, check]
    timeout: 2m
  - service: catalogue
    command: [dotnet, OcharoCatalogue.Api.dll, config, check]
    timeout: 2m
services:
  desk:
    build: { dockerfile: deployment/Dockerfile }
    paths:
      - codebase/brand-workspace.backend-services/**
      - codebase/brand-workspace.frontend-services/**
      - codebase/ocharo-brand.backend-services/Directory.*.props
      - codebase/ocharo-brand.backend-services/OcharoBrand.Domain/**
      - codebase/ocharo-catalogue.backend-services/Directory.*.props
      - codebase/ocharo-catalogue.backend-services/OcharoCatalogue.Domain/**
    # The SDK boot bundle's /health, with Desk's readiness check: PostgreSQL reachable and Desk's schema applied.
    health: /health
    needs: [postgres]
    # Desk's BFF keeps sign-in sessions in the `cache.distributed_cache` table of its own database (be sdk
    # AddPostgresDistributedCache, set `distributed_cache`, applied with Desk's schema) and its Data Protection key
    # ring on the `keys` volume, so a restart or deploy keeps everyone signed in.
    settings:
      # Wheelhouse derives AllowedHosts and Deployment:TrustedProxies, and fills ConnectionStrings:Database from the
      # target's own PostgreSQL; nobody types them.
      required: [ConnectionStrings:Database, AllowedHosts, Deployment:TrustedProxies]
      keys:
        DataProtection:KeysPath: { required: true }          # the keys volume: /var/lib/brand-workspace/keys
        DataProtection:ApplicationName: { required: true }   # keep the deployed value; a change signs everyone out
        # Sign-in through Ocharo's Identity (the BFF reads section Identity:Client from the target settings file). The
        # authority is the identity site's origin, the very value identity's issuer takes, and the secret is identity's
        # client 0, linked, so nobody types either.
        Identity:Client:Authority: { from: Sites:identity:Url }
        Identity:Client:ClientId: { default: desk }
        Identity:Client:ClientSecret: { from: Identity:Server:Clients:0:ClientSecret }
        Identity:Client:CookieName: { default: __Host-ocharo-desk }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        # Desk's audience for service tokens: background removal verifies them offline against this issuer's keys.
        Identity:Resource:Uri: { from: Sites:desk:Url }
        # Revocation signals: each URL is typed once per environment on `identity`, so both ends always name the same value.
        Identity:Client:SignalUrl: { from: Identity:Server:Clients:0:SignalUrl }
        Identity:Resource:SignalUrl: { from: Identity:Server:Resources:0:SignalUrl }
        # Media, exports, edition files and sourcing files live in WoW2 Files, tenant `ocharo` on the shared files host, reached
        # with client 0: an operator's exchanged token within their session, Desk's own for the sourcing import, the boot
        # backfill and public routes; linked to the Uri this descriptor types for its Files resource. Rows stored before
        # Files keep their bytes until the migration and boot fill their ids (research/files-adoption.md #13, #32).
        Files:BaseUrl: { from: Identity:Server:Resources:2:Uri }
        # Background removal: the private image worker, a sibling on the platform network. Its address is an owner key
        # typed per environment as `http://ocharo-<environment>-image-worker:8080`, its platform name: the bare service
        # name is an alias every environment's worker would share on that one network, and the descriptor has no template
        # for the environment. Required, because an unset address reads unavailable with no error.
        ImageProcessing:WorkerBaseUrl: { type: url, required: true }
        ImageProcessing:WorkerKey: { from: ImageWorker:Key }
        # The Ocharo app menu, served anonymously at /api/runtime-config; an unset key leaves that app out. Apps whose
        # site root is the place to land link to that site, so nobody types them; Editorial, Atlas and Wear sit under a
        # path of the blog site, so the owner types those.
        OcharoApps:Desk: { from: Sites:desk:Url }
        OcharoApps:Catalogue: { from: Sites:catalogue:Url }
        OcharoApps:Studio: { from: { repository: studio, key: Sites:studio:Url } }
        OcharoApps:Marketing: { from: { repository: marketing, key: Sites:marketing:Url } }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Brand: { from: Sites:brand:Url }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { from: { repository: marketing, key: Sites:blog:Url } }
    volumes:
      keys: /var/lib/brand-workspace/keys
    sites:
      desk: {}
  jobs:
    build: { dockerfile: deployment/Dockerfile.worker }
    paths:
      - codebase/brand-workspace.backend-services/**
      - codebase/ocharo-brand.backend-services/Directory.*.props
      - codebase/ocharo-brand.backend-services/OcharoBrand.Domain/**
      - codebase/ocharo-catalogue.backend-services/Directory.*.props
      - codebase/ocharo-catalogue.backend-services/OcharoCatalogue.Domain/**
    health: { command: [sh, -c, 'kill -0 1'] }
    needs: [postgres]
    dependsOn: [desk]
    settings:
      required: [ConnectionStrings:Database]
  image-worker:
    build:
      dockerfile: deployment/image-worker/Dockerfile
      context: codebase/ocharo-image.backend-services
    paths:
      - codebase/ocharo-image.backend-services/**
    health:
      command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=2)"]
    memory: 2g
    # The pinned U-2-Net model ships in the image, so the worker has no volume and downloads nothing at run time.
    settings:
      keys:
        ImageWorker:Key: { secret: true, required: true }
  # Ocharo's own Identity instance: WoW2's public platform image, pinned by tag (Renovate moves it), its schema in
  # Ocharo's database. Wheelhouse makes every secret but the bot token on the first deploy of each environment, so no
  # key passes through a person (pipelines v0.14.0, Wheelhouse v0.11; descriptor § Generated and linked keys), and the
  # issuer follows the identity site's host. Ocharo people sign in by phone with a code from the environment's Telegram
  # bot only: password and email sign-in are off, and no Identity:Email key is set (owner, 2026-11-02). Sign-up takes an
  # invitation from an owner or admin. Every key binds a 0.5.15 settings record (Identity's deployment.md at v0.5.15); its
  # config check refuses an unbound one, such as a stored value of the retired Identity:SignUp:IsEnabled, which the
  # first 0.5.x deploy needs deleted from each environment.
  identity:
    image: ghcr.io/wow-two-sdk-beta/wow-two-sdk-beta.identity/identity:0.5.20
    health: /health
    memory: 256m
    needs: [postgres]
    settings:
      keys:
        DatabaseSettings:ConnectionString: { required: true }
        Identity:Server:Issuer: { from: Sites:identity:Url }
        Identity:Server:Keys:IsEphemeral: { type: boolean, default: false }
        # Identity's own Development file turns on ephemeral token keys; deployed dev keeps the configured one.
        Identity:Tokens:IsKeyEphemeral: { type: boolean, default: false }
        # As a Development boot, the image's Serilog logs every SQL command at Information; keep EF's commands at Warning.
        Serilog:MinimumLevel:Override:Microsoft.EntityFrameworkCore.Database.Command: { default: Warning }
        Identity:Server:Keys:Signing:0:
          { secret: true, required: true, generate: { command: [dotnet, Identity.Api.dll, keys, generate, --role, signing] } }
        Identity:Server:Keys:Encryption:0:
          { secret: true, required: true, generate: { command: [dotnet, Identity.Api.dll, keys, generate, --role, encryption] } }
        Identity:DataProtection:Certificates:0:
          { secret: true, required: true, generate: { command: [dotnet, Identity.Api.dll, keys, generate, --role, data-protection] } }
        Identity:Tokens:SigningKey: { secret: true, required: true, generate: { random: 32 } }
        # Invitation-only sign-up; a session slides 5 days ahead of each use.
        Identity:SignUp:Mode: { type: choice, values: [Invite, Open], default: Invite }
        Identity:Sessions:Expiration: { type: choice, values: [Fixed, Sliding], default: Sliding }
        Identity:Sessions:SlidingLifetime: { default: "5.00:00:00" }
        # Telegram only: no password and no email; Uzbek numbers only.
        Identity:Methods:Password:IsEnabled: { type: boolean, default: false }
        Identity:Methods:Email:IsEnabled: { type: boolean, default: false }
        # The invite sign-up page asks a name and a picture, then verifies the phone through the bot with no code; apps
        # get the `picture` claim, a link under the issuer.
        Identity:SignUp:Profile:DisplayName: { type: choice, values: [Off, Optional, Required], default: Required }
        Identity:SignUp:Profile:Picture: { type: choice, values: [Off, Optional, Required], default: Required }
        Identity:Phone:AllowedCountries:0: { default: UZ }
        # The environment's own bot, on a webhook the boot registers at {issuer}/api/telegram/webhook. The developer
        # enters its user name without @ (dev ocharo_dev_bot, prod ocharo_bot) and its token in Wheelhouse.
        Identity:Telegram:IsEnabled: { type: boolean, default: true }
        Identity:Telegram:UpdateMode: { type: choice, values: [Webhook, Polling], default: Webhook }
        Identity:Telegram:BotUserName: { required: true }
        Identity:Telegram:BotToken: { secret: true, required: true }
        Identity:Telegram:WebhookSecret: { secret: true, required: true, generate: { random: 32, encoding: hex } }
        Identity:Otp:HashKey: { secret: true, required: true, generate: { random: 32 } }
        # The app the bot's code and sign-in messages name; the image's default is "Identity".
        Identity:Otp:Messages:AppName: { default: Ocharo }
        # A trusted contact receives a person's codes, so an invitation can name one and the person adds their phone later.
        Identity:TrustedContacts:IsEnabled: { type: boolean, default: true }
        # The hosted pages' one look for this instance.
        Identity:Pages:Theme: { default: ocharo }
        Identity:Pages:BrandName: { default: Ocharo }
        # What each catalog role grants in Ocharo's apps (owner, admin, editor, viewer, billing; never a role of its
        # own); apps read them as org_permission, each client only its own namespace. In the apps' namespaces viewer and
        # billing grant none; in Files', viewer reads (below).
        Identity:Organizations:Roles:owner:0: { default: "desk:edit" }
        Identity:Organizations:Roles:owner:1: { default: "desk:approve" }
        Identity:Organizations:Roles:owner:2: { default: "brand:edit" }
        Identity:Organizations:Roles:owner:3: { default: "brand:approve" }
        Identity:Organizations:Roles:owner:4: { default: "catalogue:edit" }
        Identity:Organizations:Roles:owner:5: { default: "catalogue:approve" }
        Identity:Organizations:Roles:owner:6: { default: "marketing:edit" }
        Identity:Organizations:Roles:owner:7: { default: "marketing:approve" }
        Identity:Organizations:Roles:owner:8: { default: "editorial:edit" }
        Identity:Organizations:Roles:owner:9: { default: "editorial:approve" }
        Identity:Organizations:Roles:owner:10: { default: "studio:edit" }
        # Files reads only org_permission, through the `files` resource's namespace: owner and admin hold every Files
        # right, editors read and write; shares and admin stay with owner and admin.
        Identity:Organizations:Roles:owner:11: { default: "files:read" }
        Identity:Organizations:Roles:owner:12: { default: "files:write" }
        Identity:Organizations:Roles:owner:13: { default: "files:share" }
        Identity:Organizations:Roles:owner:14: { default: "files:admin" }
        Identity:Organizations:Roles:admin:0: { default: "desk:edit" }
        Identity:Organizations:Roles:admin:1: { default: "desk:approve" }
        Identity:Organizations:Roles:admin:2: { default: "brand:edit" }
        Identity:Organizations:Roles:admin:3: { default: "brand:approve" }
        Identity:Organizations:Roles:admin:4: { default: "catalogue:edit" }
        Identity:Organizations:Roles:admin:5: { default: "catalogue:approve" }
        Identity:Organizations:Roles:admin:6: { default: "marketing:edit" }
        Identity:Organizations:Roles:admin:7: { default: "marketing:approve" }
        Identity:Organizations:Roles:admin:8: { default: "editorial:edit" }
        Identity:Organizations:Roles:admin:9: { default: "editorial:approve" }
        Identity:Organizations:Roles:admin:10: { default: "studio:edit" }
        Identity:Organizations:Roles:admin:11: { default: "files:read" }
        Identity:Organizations:Roles:admin:12: { default: "files:write" }
        Identity:Organizations:Roles:admin:13: { default: "files:share" }
        Identity:Organizations:Roles:admin:14: { default: "files:admin" }
        Identity:Organizations:Roles:editor:0: { default: "desk:edit" }
        Identity:Organizations:Roles:editor:1: { default: "brand:edit" }
        Identity:Organizations:Roles:editor:2: { default: "catalogue:edit" }
        Identity:Organizations:Roles:editor:3: { default: "marketing:edit" }
        Identity:Organizations:Roles:editor:4: { default: "editorial:edit" }
        Identity:Organizations:Roles:editor:5: { default: "studio:edit" }
        Identity:Organizations:Roles:editor:6: { default: "files:read" }
        Identity:Organizations:Roles:editor:7: { default: "files:write" }
        # A viewer reads every app's media as a member, and that read reaches Files with the viewer's own token.
        Identity:Organizations:Roles:viewer:0: { default: "files:read" }
        # WoW2 Events reads only org_permission, through the `events` resource's namespace (events-integration #23,
        # research/events-adoption.md #4): owner and admin hold every Events right, review included; editors read and
        # track; viewers read. Billing grants none.
        Identity:Organizations:Roles:owner:15: { default: "events:read" }
        Identity:Organizations:Roles:owner:16: { default: "events:track" }
        Identity:Organizations:Roles:owner:17: { default: "events:review" }
        Identity:Organizations:Roles:owner:18: { default: "events:admin" }
        Identity:Organizations:Roles:admin:15: { default: "events:read" }
        Identity:Organizations:Roles:admin:16: { default: "events:track" }
        Identity:Organizations:Roles:admin:17: { default: "events:review" }
        Identity:Organizations:Roles:admin:18: { default: "events:admin" }
        Identity:Organizations:Roles:editor:8: { default: "events:read" }
        Identity:Organizations:Roles:editor:9: { default: "events:track" }
        Identity:Organizations:Roles:viewer:1: { default: "events:read" }
        # Clients at fixed indexes, since the seeder deletes a client that leaves the settings: 0 desk, 1 brand,
        # 2 catalogue, 3 marketing, 4 editorial, 5 studio, 6 public-build, 7 assets-release, 8 events,
        # 9 harvest-operator and 10 events-console. Each secret but 7's
        # is generated, and the app links its client-secret key to it with `from` (Desk above). The redirect URIs are
        # owner keys, typed once per environment as `{site URL}/api/identity/callback` and `{site URL}/`: the descriptor
        # has no URL template, and `from: Sites:<site>:Url` renders the bare origin (`https://<host>`, no path), which
        # Identity registers verbatim and matches exactly against the BFF's callback and sign-out URIs. A client
        # registers whole or not at all: an id and a secret without RedirectUris fail Identity's boot ("has no
        # RedirectUris"), so a client joins with its app. Marketing, editorial and studio sites live in other
        # repositories, and pipelines v0.15.0 `link_sources` accepts a `from` only for a site this descriptor declares.
        Identity:Server:Clients:0:ClientId: { default: desk }
        Identity:Server:Clients:0:DisplayName: { default: Ocharo Desk }
        Identity:Server:Clients:0:PermissionNamespace: { default: desk }
        Identity:Server:Clients:0:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:0:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:0:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:0:SignalUrl: { type: url, required: true }
        Identity:Server:Clients:1:ClientId: { default: brand }
        Identity:Server:Clients:1:DisplayName: { default: Ocharo Brand }
        Identity:Server:Clients:1:PermissionNamespace: { default: brand }
        Identity:Server:Clients:1:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:1:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:1:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:1:SignalUrl: { type: url, required: true }
        Identity:Server:Clients:2:ClientId: { default: catalogue }
        Identity:Server:Clients:2:DisplayName: { default: Ocharo Catalogue }
        Identity:Server:Clients:2:PermissionNamespace: { default: catalogue }
        Identity:Server:Clients:2:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:2:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:2:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:2:SignalUrl: { type: url, required: true }
        Identity:Server:Clients:3:ClientId: { default: marketing }
        Identity:Server:Clients:3:DisplayName: { default: Ocharo Marketing }
        Identity:Server:Clients:3:PermissionNamespace: { default: marketing }
        Identity:Server:Clients:3:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:3:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:3:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:3:SignalUrl: { type: url, required: true }
        Identity:Server:Clients:4:ClientId: { default: editorial }
        Identity:Server:Clients:4:DisplayName: { default: Ocharo Editorial }
        Identity:Server:Clients:4:PermissionNamespace: { default: editorial }
        Identity:Server:Clients:4:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:4:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:4:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:4:SignalUrl: { type: url, required: true }
        Identity:Server:Clients:5:ClientId: { default: studio }
        Identity:Server:Clients:5:DisplayName: { default: Ocharo Studio }
        Identity:Server:Clients:5:PermissionNamespace: { default: studio }
        Identity:Server:Clients:5:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:5:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:5:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:5:SignalUrl: { type: url, required: true }
        # Service tokens. Editorial (client 4) calls Desk as itself. Client 6 is the live public build, which reads
        # Editorial's export and signs nobody in, so it has no redirect URIs. A resource's URI is an owner key typed
        # per environment as `{site URL}/`: the boot refuses one without its slash, and `from: Sites:<site>:Url` renders
        # the bare origin. A scope is {service}.{action} with two segments, as the boot requires.
        Identity:Server:Clients:4:Grants:0: { default: authorization_code }
        Identity:Server:Clients:4:Grants:1: { default: client_credentials }
        Identity:Server:Clients:4:Resources:0: { default: desk }
        Identity:Server:Clients:4:Scopes:0: { default: desk.remove-background }
        Identity:Server:Clients:6:ClientId: { default: public-build }
        Identity:Server:Clients:6:DisplayName: { default: Ocharo public build }
        Identity:Server:Clients:6:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:6:Grants:0: { default: client_credentials }
        Identity:Server:Clients:6:Resources:0: { default: editorial }
        Identity:Server:Clients:6:Scopes:0: { default: editorial.export }
        # Client 7, assets-release: ocharo-assets' release workflow uploads the garment release to Files as public files
        # (research/files-adoption.md #14, #33). Its secret is typed, not generated, since the same value is that
        # repository's GitHub Actions secret OCHARO_ASSETS_CLIENT_SECRET; it signs in only as itself.
        Identity:Server:Clients:7:ClientId: { default: assets-release }
        Identity:Server:Clients:7:DisplayName: { default: Ocharo assets release }
        Identity:Server:Clients:7:ClientSecret: { secret: true, required: true }
        Identity:Server:Clients:7:Grants:0: { default: client_credentials }
        Identity:Server:Clients:7:Resources:0: { default: files }
        Identity:Server:Clients:7:Scopes:0: { default: files.write }
        # Files (research/files-adoption.md #15–#18): each app reaches `files` for a person by token exchange, and as
        # itself by client credentials for its seeds, jobs and public-media redirects; Studio only for a person. A Grants
        # list replaces "empty means the code flow alone", so authorization_code comes first. Clients 0–5 reuse their
        # secrets; public-build reads no file, since published media is public.
        Identity:Server:Clients:0:Grants:0: { default: authorization_code }
        Identity:Server:Clients:0:Grants:1: { default: client_credentials }
        Identity:Server:Clients:0:Grants:2: { default: token_exchange }
        Identity:Server:Clients:0:Resources:0: { default: files }
        Identity:Server:Clients:0:ExchangeResources:0: { default: files }
        Identity:Server:Clients:0:Scopes:0: { default: files.read }
        Identity:Server:Clients:0:Scopes:1: { default: files.write }
        Identity:Server:Clients:1:Grants:0: { default: authorization_code }
        Identity:Server:Clients:1:Grants:1: { default: client_credentials }
        Identity:Server:Clients:1:Grants:2: { default: token_exchange }
        Identity:Server:Clients:1:Resources:0: { default: files }
        Identity:Server:Clients:1:ExchangeResources:0: { default: files }
        Identity:Server:Clients:1:Scopes:0: { default: files.read }
        Identity:Server:Clients:1:Scopes:1: { default: files.write }
        Identity:Server:Clients:2:Grants:0: { default: authorization_code }
        Identity:Server:Clients:2:Grants:1: { default: client_credentials }
        Identity:Server:Clients:2:Grants:2: { default: token_exchange }
        Identity:Server:Clients:2:Resources:0: { default: files }
        Identity:Server:Clients:2:ExchangeResources:0: { default: files }
        Identity:Server:Clients:2:Scopes:0: { default: files.read }
        Identity:Server:Clients:2:Scopes:1: { default: files.write }
        Identity:Server:Clients:3:Grants:0: { default: authorization_code }
        Identity:Server:Clients:3:Grants:1: { default: client_credentials }
        Identity:Server:Clients:3:Grants:2: { default: token_exchange }
        Identity:Server:Clients:3:Resources:0: { default: files }
        Identity:Server:Clients:3:ExchangeResources:0: { default: files }
        Identity:Server:Clients:3:Scopes:0: { default: files.read }
        Identity:Server:Clients:3:Scopes:1: { default: files.write }
        Identity:Server:Clients:4:Grants:2: { default: token_exchange }
        Identity:Server:Clients:4:Resources:1: { default: files }
        Identity:Server:Clients:4:ExchangeResources:0: { default: files }
        Identity:Server:Clients:4:Scopes:1: { default: files.read }
        Identity:Server:Clients:4:Scopes:2: { default: files.write }
        Identity:Server:Clients:5:Grants:0: { default: authorization_code }
        Identity:Server:Clients:5:Grants:1: { default: token_exchange }
        Identity:Server:Clients:5:ExchangeResources:0: { default: files }
        Identity:Server:Clients:5:Scopes:0: { default: files.read }
        Identity:Server:Clients:5:Scopes:1: { default: files.write }
        # WoW2 Events (events-integration #21–#23, #30; research/events-adoption.md #2): Desk reaches `events` for a person
        # only, by token exchange, and Events checks a scope plus an `events:*` permission against the token's org_id.
        Identity:Server:Clients:0:ExchangeResources:1: { default: events }
        Identity:Server:Clients:0:Scopes:2: { default: events.read }
        Identity:Server:Clients:0:Scopes:3: { default: events.track }
        Identity:Server:Clients:0:Scopes:4: { default: events.import }
        # Client 8, events: WoW2 Events pulls SCFD's deliveries as itself. Clients 8–10 belong to other products
        # (Events, SCFD); their generated secrets reach those targets through Wheelhouse's owner link, never typed twice.
        Identity:Server:Clients:8:ClientId: { default: events }
        Identity:Server:Clients:8:DisplayName: { default: WoW2 Events }
        Identity:Server:Clients:8:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:8:Grants:0: { default: client_credentials }
        Identity:Server:Clients:8:Resources:0: { default: harvest }
        Identity:Server:Clients:8:Scopes:0: { default: harvest.events-read }
        # Client 9, harvest-operator: SCFD's operator provisions tenants, containers, sources, pipelines and
        # subscriptions as itself, with every SCFD scope.
        Identity:Server:Clients:9:ClientId: { default: harvest-operator }
        Identity:Server:Clients:9:DisplayName: { default: SCFD operator }
        Identity:Server:Clients:9:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:9:Grants:0: { default: client_credentials }
        Identity:Server:Clients:9:Resources:0: { default: harvest }
        Identity:Server:Clients:9:Scopes:0: { default: harvest.tenants-manage }
        Identity:Server:Clients:9:Scopes:1: { default: harvest.containers-manage }
        Identity:Server:Clients:9:Scopes:2: { default: harvest.sources-manage }
        Identity:Server:Clients:9:Scopes:3: { default: harvest.pipelines-read }
        Identity:Server:Clients:9:Scopes:4: { default: harvest.pipelines-run }
        Identity:Server:Clients:9:Scopes:5: { default: harvest.pipelines-manage }
        Identity:Server:Clients:9:Scopes:6: { default: harvest.subscriptions-manage }
        Identity:Server:Clients:9:Scopes:7: { default: harvest.events-read }
        Identity:Server:Clients:9:Scopes:8: { default: harvest.links-submit }
        Identity:Server:Clients:9:Scopes:9: { default: harvest.entries-write }
        Identity:Server:Clients:9:Scopes:10: { default: harvest.posts-read }
        # Client 10, events-console: WoW2 Events' review console signs reviewers in through its BFF; a reviewer needs
        # `events:review` in the catalog's owner organization. Its URIs are owner keys typed per environment from Events'
        # Uri (`{Uri}api/identity/callback`, `{Uri}`, `{Uri}api/identity/signal`); its secret reaches the Events target
        # through Wheelhouse's owner link.
        Identity:Server:Clients:10:ClientId: { default: events-console }
        Identity:Server:Clients:10:DisplayName: { default: WoW2 Events review }
        Identity:Server:Clients:10:PermissionNamespace: { default: events }
        Identity:Server:Clients:10:ClientSecret: { secret: true, required: true, generate: { random: 32 } }
        Identity:Server:Clients:10:RedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:10:PostSignOutRedirectUris:0: { type: url, required: true }
        Identity:Server:Clients:10:SignalUrl: { type: url, required: true }
        Identity:Server:Resources:0:Name: { default: desk }
        Identity:Server:Resources:0:Uri: { type: url, required: true }
        Identity:Server:Resources:0:Scopes:0: { default: desk.remove-background }
        Identity:Server:Resources:0:SignalUrl: { type: url, required: true }
        Identity:Server:Resources:1:Name: { default: editorial }
        Identity:Server:Resources:1:Uri: { type: url, required: true }
        Identity:Server:Resources:1:Scopes:0: { default: editorial.export }
        Identity:Server:Resources:1:SignalUrl: { type: url, required: true }
        # Files' audience is Ocharo's own Files hostname on the shared files host B, typed per environment with its
        # slash: on dev, which has no domain, `https://ocharo-files-dev.{products host}.sslip.io/`. The later move to
        # Ocharo's own instance changes no entry; its signals go to `{Uri}signals/identity`. `files.tenants` is B's operator scope and never registers here.
        Identity:Server:Resources:2:Name: { default: files }
        Identity:Server:Resources:2:Uri: { type: url, required: true }
        Identity:Server:Resources:2:Scopes:0: { default: files.read }
        Identity:Server:Resources:2:Scopes:1: { default: files.write }
        Identity:Server:Resources:2:Scopes:2: { default: files.share }
        Identity:Server:Resources:2:Scopes:3: { default: files.admin }
        Identity:Server:Resources:2:PermissionNamespace: { default: files }
        Identity:Server:Resources:2:SignalUrl: { type: url, required: true }
        # WoW2 Events' audience, typed per environment as `https://events.{domain}/` with its slash; exchanged tokens carry
        # sid and org_id, so its signals go to `{Uri}signals/identity`.
        Identity:Server:Resources:3:Name: { default: events }
        Identity:Server:Resources:3:Uri: { type: url, required: true }
        Identity:Server:Resources:3:Scopes:0: { default: events.read }
        Identity:Server:Resources:3:Scopes:1: { default: events.track }
        Identity:Server:Resources:3:Scopes:2: { default: events.review }
        Identity:Server:Resources:3:Scopes:3: { default: events.import }
        Identity:Server:Resources:3:Scopes:4: { default: events.admin }
        Identity:Server:Resources:3:PermissionNamespace: { default: events }
        Identity:Server:Resources:3:SignalUrl: { type: url, required: true }
        # SCFD's audience, typed per environment as its API site URL with the slash (dev: product `harvestadapters`).
        # Only service tokens reach it, so it has no permission namespace and no signal URL (Identity 0.5.20: null hears
        # none).
        Identity:Server:Resources:4:Name: { default: harvest }
        Identity:Server:Resources:4:Uri: { type: url, required: true }
        Identity:Server:Resources:4:Scopes:0: { default: harvest.tenants-manage }
        Identity:Server:Resources:4:Scopes:1: { default: harvest.containers-manage }
        Identity:Server:Resources:4:Scopes:2: { default: harvest.sources-manage }
        Identity:Server:Resources:4:Scopes:3: { default: harvest.pipelines-read }
        Identity:Server:Resources:4:Scopes:4: { default: harvest.pipelines-run }
        Identity:Server:Resources:4:Scopes:5: { default: harvest.pipelines-manage }
        Identity:Server:Resources:4:Scopes:6: { default: harvest.subscriptions-manage }
        Identity:Server:Resources:4:Scopes:7: { default: harvest.events-read }
        Identity:Server:Resources:4:Scopes:8: { default: harvest.links-submit }
        Identity:Server:Resources:4:Scopes:9: { default: harvest.entries-write }
        Identity:Server:Resources:4:Scopes:10: { default: harvest.posts-read }
    sites:
      identity: { paths: [/, /api] }
  brand:
    build: { dockerfile: deployment/brand/Dockerfile }
    paths:
      - codebase/ocharo-brand.backend-services/**
      - codebase/ocharo-brand.frontend-services/**
    health: /health                     # be sdk readiness over the PostgreSQL context
    needs: [postgres]
    # Rows in schema `brand` of the product database; sessions (schema `brand_cache`) and the Data Protection key ring
    # (`brand.data_protection_keys`) live there too, so a restart or deploy keeps everyone signed in.
    settings:
      # Wheelhouse derives AllowedHosts and Deployment:TrustedProxies (the ingress, whose forwarded scheme the
      # same-origin write check needs), and fills ConnectionStrings:Database from the target's own PostgreSQL; nobody
      # types them.
      required: [ConnectionStrings:Database, AllowedHosts, Deployment:TrustedProxies]
      keys:
        # Today's key-ring name, so sessions survive dev switching to .NET Development.
        DataProtection:ApplicationName: { default: "ocharo-brand:Production" }
        # Sign-in through Ocharo's Identity as client 1, linked like Desk's; reads need membership of the bound
        # organization, writes brand:edit, publish and withdraw brand:approve.
        Identity:Client:Authority: { from: Sites:identity:Url }
        Identity:Client:ClientId: { default: brand }
        Identity:Client:ClientSecret: { from: Identity:Server:Clients:1:ClientSecret }
        Identity:Client:CookieName: { default: __Host-ocharo-brand }
        Identity:Client:SignalUrl: { from: Identity:Server:Clients:1:SignalUrl }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        Brand:OrganizationId: { required: true }             # Ocharo's organization id in that environment's Identity
        # Media live in WoW2 Files, tenant `ocharo` on the shared files host, reached with the same Identity client: a
        # person's exchanged token within their session, Brand's own otherwise. Typed per environment as the Uri of
        # Identity:Server:Resources:2; the shared host is no site of this
        # descriptor, so no `from:` reaches it. Files stored before it read from the blobs below until the migration.
        Files:BaseUrl: { type: url, required: true }
        # The Ocharo app menu, served anonymously at /api/runtime-config; an unset key leaves that app out. Apps whose
        # site root is the place to land link to that site, so nobody types them; Editorial, Atlas and Wear sit under a
        # path of the blog site, so the owner types those.
        OcharoApps:Desk: { from: Sites:desk:Url }
        OcharoApps:Catalogue: { from: Sites:catalogue:Url }
        OcharoApps:Studio: { from: { repository: studio, key: Sites:studio:Url } }
        OcharoApps:Marketing: { from: { repository: marketing, key: Sites:marketing:Url } }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Brand: { from: Sites:brand:Url }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { from: { repository: marketing, key: Sites:blog:Url } }
    volumes:
      # Blobs stored before WoW2 Files, and the retired SQLite store and file key ring until `import-sqlite`
      # (deployment/brand/brand.md § PostgreSQL move).
      brand-data: /data
    sites:
      brand: {}
  catalogue:
    build: { dockerfile: deployment/catalogue/Dockerfile }
    paths:
      - codebase/ocharo-catalogue.backend-services/**
      - codebase/ocharo-catalogue.frontend-services/**
    health: /health                     # be sdk readiness over the PostgreSQL context
    memory: 1g
    needs: [postgres]
    # Rows in schema `catalogue` of the product database; sessions (schema `catalogue_cache`) and the Data Protection key
    # ring (`catalogue.data_protection_keys`) live there too, so a restart or deploy keeps everyone signed in.
    settings:
      # Wheelhouse derives AllowedHosts and Deployment:TrustedProxies (the ingress, whose forwarded scheme the
      # same-origin write check needs), and fills ConnectionStrings:Database from the target's own PostgreSQL; nobody
      # types them.
      required: [ConnectionStrings:Database, AllowedHosts, Deployment:TrustedProxies]
      keys:
        # Today's key-ring name, so sessions survive dev switching to .NET Development.
        DataProtection:ApplicationName: { default: "ocharo-catalogue:Production" }
        # Sign-in through Ocharo's Identity as client 2, linked like Desk's; the published reader stays public, every
        # other route needs membership of the bound organization, writes catalogue:edit, publish and withdraw
        # catalogue:approve.
        Identity:Client:Authority: { from: Sites:identity:Url }
        Identity:Client:ClientId: { default: catalogue }
        Identity:Client:ClientSecret: { from: Identity:Server:Clients:2:ClientSecret }
        Identity:Client:CookieName: { default: __Host-ocharo-catalogue }
        Identity:Client:SignalUrl: { from: Identity:Server:Clients:2:SignalUrl }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        Catalogue:OrganizationId: { required: true }         # Ocharo's organization id in that environment's Identity
        # Product images and released PDFs and page PNGs live in WoW2 Files like Brand's media, typed as the same Uri
        # (Identity:Server:Resources:2); those stored before Files read from this volume until the migration
        # (research/files-adoption.md #24, #26).
        Files:BaseUrl: { type: url, required: true }
        # The Ocharo app menu, served anonymously at /api/runtime-config; an unset key leaves that app out. Apps whose
        # site root is the place to land link to that site, so nobody types them; Editorial, Atlas and Wear sit under a
        # path of the blog site, so the owner types those.
        OcharoApps:Desk: { from: Sites:desk:Url }
        OcharoApps:Catalogue: { from: Sites:catalogue:Url }
        OcharoApps:Studio: { from: { repository: studio, key: Sites:studio:Url } }
        OcharoApps:Marketing: { from: { repository: marketing, key: Sites:marketing:Url } }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Brand: { from: Sites:brand:Url }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { from: { repository: marketing, key: Sites:blog:Url } }
    volumes:
      # Blobs stored before WoW2 Files, and the retired SQLite store and file key ring until `import-sqlite`
      # (deployment/catalogue/catalogue.md § PostgreSQL move).
      catalogue-data: /data
    sites:
      catalogue: {}
