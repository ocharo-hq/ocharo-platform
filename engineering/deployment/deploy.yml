# yaml-language-server: $schema=../../../../../../../conventions/deployment/descriptor/deploy.schema.json
# What this product deploys: its services, how each builds, what changes it and which sites it serves.
# Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets and
# environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
#
# Ocharo Platform deploys Desk, its jobs worker and the private image worker. The adopted Brand and Catalogue
# pilots stay loopback-only and are never deployed; Desk and jobs compile only their Domain projects.
descriptor: 1
product: ocharo-platform
services:
  desk:
    build: { dockerfile: deployment/Dockerfile }
    paths:
      - codebase/brand-workspace.backend-services/**
      - codebase/brand-workspace.frontend-services/**
      - codebase/ocharo-brand.backend-services/Directory.*.props
      - codebase/ocharo-brand.backend-services/OcharoBrand.Domain/**
      - codebase/ocharo-catalogue.backend-services/Directory.*.props
      - codebase/ocharo-catalogue.backend-services/OcharoCatalogue.Domain/**
    # Desk serves its own readiness probe (PostgreSQL and schema); it does not use the SDK boot bundle's /health.
    health: /health/ready
    needs: [postgres]
    settings:
      required: [ConnectionStrings:Database, AllowedHosts, DataProtection:KeysPath, DataProtection:ApplicationName]
    volumes:
      keys: /var/lib/brand-workspace/keys
    sites:
      app: { exposure: private }
  jobs:
    build: { dockerfile: deployment/Dockerfile.worker }
    paths:
      - codebase/brand-workspace.backend-services/**
      - codebase/ocharo-brand.backend-services/Directory.*.props
      - codebase/ocharo-brand.backend-services/OcharoBrand.Domain/**
      - codebase/ocharo-catalogue.backend-services/Directory.*.props
      - codebase/ocharo-catalogue.backend-services/OcharoCatalogue.Domain/**
    health: { command: [sh, -c, 'kill -0 1'] }
    needs: [postgres]
    settings:
      required: [ConnectionStrings:Database]
  image-worker:
    build:
      dockerfile: codebase/ocharo-image.backend-services/Dockerfile
      context: codebase/ocharo-image.backend-services
    paths:
      - codebase/ocharo-image.backend-services/**
    health:
      command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=2)"]
    memory: 2g
    settings:
      required: [ImageWorker:Key]
    volumes:
      models: /models
