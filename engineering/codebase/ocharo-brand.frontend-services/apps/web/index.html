<!doctype html>
<!-- `theme-ocharo` applies the fe SDK's Ocharo theme; the pre-paint script adds `dark` beside it. -->
<html lang="uz" class="theme-ocharo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- The Ocharo symbol: ink on a light tab strip, reverse on a dark one; the touch icon is the opaque app tile. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- The SDK pre-paint colour script, generated by vite.config.ts: applies the remembered scheme before the first paint. -->
    <script src="%BASE_URL%theme.js"></script>
    <link rel="stylesheet" href="%BASE_URL%boot-splash.css" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <title>Ocharo Brend</title>
  </head>
  <body>
    <div id="root">
      <!-- The splash's static twin (public/boot-splash.css): the SDK SplashScreen's logo and bar, shown before scripts
           load. Mounting the app replaces it; the mounted splash then lifts once the session and the first place settle. -->
      <div class="boot-splash" role="status" aria-label="Yuklanmoqda…">
        <img
          class="boot-splash-logo boot-splash-logo-ink"
          src="%BASE_URL%brand/ocharo-wordmark-ink.png"
          alt="Ocharo"
          width="240"
          height="90"
        />
        <img
          class="boot-splash-logo boot-splash-logo-reverse"
          src="%BASE_URL%brand/ocharo-wordmark-reverse.png"
          alt="Ocharo"
          width="240"
          height="90"
        />
        <div class="boot-splash-bar" aria-hidden="true"><div class="boot-splash-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
