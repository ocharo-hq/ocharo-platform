<!doctype html>
<!-- `theme-ocharo` applies the fe SDK's Ocharo theme; the pre-paint script adds `dark` beside it. -->
<html lang="uz" class="theme-ocharo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- The SDK pre-paint colour script, generated by vite.config.ts: applies the remembered scheme before the first paint. -->
    <script src="%BASE_URL%theme.js"></script>
    <link rel="stylesheet" href="%BASE_URL%boot-splash.css" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <title>Ocharo Brend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
